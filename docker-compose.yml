# =============================================================
# Stack abdoul-didacticiel – MODE HYBRIDE (Local/Prod)
# =============================================================

networks:
  traefik-public:
    external: true
  internal:
    driver: bridge # On utilise bridge pour le dev simple sur WSL

services:

  # ========================================
  # TRAEFIK – Reverse proxy
  # ========================================
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--log.level=INFO"
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 8080
        published: 8080
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard.rule=PathPrefix(`/dashboard`)"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.entrypoints=web"
    networks:
      - traefik-public

  # ========================================
  # DJANGO APP (Ton Monolithe)
  # ========================================
  web:
    build: .
    image: ${DOCKERHUB_USERNAME:-abdoul}/abdoul-didacticiel:latest
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://admin:pass@db:5432/didacticiel_db
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=8000"
    networks:
      - traefik-public
      - internal

  # ========================================
  # BASE DE DONNÉES (Indispensable en local)
  # ========================================
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=didacticiel_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  # ========================================
  # OBSERVABILITÉ (On garde tes outils !)
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - internal

volumes:
  postgres_data: